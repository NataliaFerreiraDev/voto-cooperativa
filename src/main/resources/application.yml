spring:
  application:
    name: voto-cooperativa
  datasource:
    url: jdbc:h2:file:./data/votocooperativa
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    br.com.nataliafdangelo.votocooperativa: INFO
  charset:
    console: UTF-8
    file: UTF-8

app:
  cpf-service:
    url: ${CPF_SERVICE_URL:https://user-info.herokuapp.com}
    timeout-seconds: ${CPF_SERVICE_TIMEOUT_SECONDS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: API REST para gestão de pautas e votação em assembleias de cooperativa
