spring:
  application:
    name: voto-cooperativa
  datasource:
    url: jdbc:h2:file:./data/votocooperativa
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    br.com.nataliafdangelo.votocooperativa: INFO
